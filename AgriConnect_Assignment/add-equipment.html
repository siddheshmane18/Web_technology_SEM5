<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List Equipment | AgriConnect</title><link rel="stylesheet" href="style.css">
  <script src="js/main.js" defer></script><script src="js/validation.js" defer></script><script src="js/equipment.js" defer></script>
</head>
<body>
<header class="site-header"><nav class="navbar container"><a class="logo" href="index.html">🌾 AgriConnect</a><button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">☰</button><ul class="nav-links" id="navLinks"><li><a href="index.html">Home</a></li><li><a href="equipment.html">Equipment</a></li><li><a class="active" href="add-equipment.html">List Equipment</a></li><li><a href="my-equipment.html">My Equipment</a></li></ul><div class="nav-buttons" id="navButtons"><a class="btn btn-outline" href="login.html">Login</a><a class="btn btn-primary" href="register.html">Register</a></div></nav></header>
<main class="form-page"><section class="form-card form-card-wide"><div class="form-heading"><span class="form-icon">🚜</span><span class="eyebrow">Share your machinery</span><h1 id="equipmentFormTitle">List equipment</h1><p>Add accurate details so other farmers can find your equipment.</p></div>
<form id="equipmentForm" novalidate>
  <input type="hidden" id="equipmentId">
  <div class="form-grid">
    <div class="form-group"><label for="name">Equipment name *</label><input id="name" maxlength="80" required placeholder="e.g. John Deere Tractor"><small class="field-error" id="nameError"></small></div>
    <div class="form-group"><label for="category">Category *</label><select id="category" required><option value="">Select category</option><option>Tractor</option><option>Cultivator</option><option>Irrigation</option><option>Harvester</option><option>Sprayer</option><option>Other Tools</option></select><small class="field-error" id="categoryError"></small></div>
    <div class="form-group"><label for="location">Location *</label><input id="location" maxlength="80" required placeholder="e.g. Pune"><small class="field-error" id="locationError"></small></div>
    <div class="form-group"><label for="price">Rental price per day (₹) *</label><input id="price" type="number" min="1" step="1" required placeholder="e.g. 1500"><small class="field-error" id="priceError"></small></div>
    <div class="form-group"><label for="brand">Brand / Power (optional)</label><input id="brand" maxlength="80" placeholder="e.g. John Deere, 55 HP"></div>
    <div class="form-group"><label for="condition">Condition *</label><select id="condition" required><option value="">Select condition</option><option>Excellent</option><option>Good</option><option>Fair</option></select><small class="field-error" id="conditionError"></small></div>
    <div class="form-group"><label for="fuel">Fuel / Type (optional)</label><input id="fuel" maxlength="50" placeholder="e.g. Diesel"></div>
    <div class="form-group"><label for="icon">Equipment icon</label><select id="icon"><option>🚜</option><option>🌱</option><option>💧</option><option>🌾</option><option>🧴</option><option>🛠️</option></select></div>
  </div>
  <div class="form-group"><label for="description">Description *</label><textarea id="description" rows="4" maxlength="600" required placeholder="Describe the equipment and suitable farming tasks."></textarea><small class="field-error" id="descriptionError"></small></div>
  <p id="equipmentFormMessage" class="form-message" role="alert" aria-live="polite"></p>
  <div class="form-actions"><button class="btn btn-primary" type="submit">Save Equipment</button><a href="my-equipment.html" class="btn btn-outline">Cancel</a></div>
</form></section></main>
<footer class="copyright">© 2026 AgriConnect. All rights reserved.</footer>
</body></html>
